# .github/workflows/secret.yaml
# -----------------------------------------------------------------------------
# Standalone gitleaks secret scan for PUBLIC repos.
#
# Why this isn't the usual thin stub: this repo is public, and GitHub does not
# allow a public repo to call a reusable workflow that lives in a private repo
# (redactolabs/security-workflows). So the scan logic from
# security-workflows/.github/workflows/gitleaks.yml@v1 is inlined here,
# unchanged in behaviour:
#   - full-history checkout so every commit on a PR is scanned
#   - .gitleaks.toml / .gitleaksignore / .gitleaks-baseline.json taken from the
#     PR's trusted BASE branch, never the PR head
#   - pinned, checksum-verified gitleaks binary (no marketplace action)
#   - Slack alert on failure
#
# If this logic changes in security-workflows, mirror the change here.
# -----------------------------------------------------------------------------
name: secret scan

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.18.4"
  GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use scan config from the trusted base branch
        env:
          # pull_request -> the branch the PR merges INTO (staging/main).
          # push         -> the branch that was pushed.
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          BASE="refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify --quiet "$BASE" >/dev/null || { echo "::error::base branch ${BASE_REF} not found in checkout"; exit 1; }
          echo "Trusted config source: ${BASE_REF} ($(git rev-parse --short "$BASE"))"
          for f in .gitleaks.toml .gitleaksignore .gitleaks-baseline.json; do
            # Whatever the PR head has for these files is discarded.
            rm -f "$f"
            if git cat-file -e "${BASE}:$f" 2>/dev/null; then
              git show "${BASE}:$f" > "$f"
              echo "  using $f from base branch"
            else
              echo "  no $f on base branch"
            fi
          done

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tgz gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          ARGS=(detect --source . --redact --no-banner --verbose)
          if [ -f .gitleaks.toml ]; then
            ARGS+=(--config .gitleaks.toml)
          fi
          if [ -f .gitleaks-baseline.json ]; then
            echo "Baseline present - historical findings listed there are ignored"
            ARGS+=(--baseline-path .gitleaks-baseline.json)
          fi
          gitleaks "${ARGS[@]}"

      - name: Notify Slack on failure
        # Fork PRs get no secrets, so this step self-skips there.
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPENDABOT_WEBHOOK_URL_TEST }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # jq builds the JSON so branch names / actor names can't break or
          # inject into the payload.
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" --arg ref "$REF" --arg actor "$ACTOR" --arg url "$RUN_URL" \
            '{blocks: [
              {type:"header", text:{type:"plain_text", text:("🚨 Possible secret detected — " + $repo), emoji:true}},
              {type:"section", fields:[
                {type:"mrkdwn", text:("*Repo:*\n`" + $repo + "`")},
                {type:"mrkdwn", text:("*Branch:*\n`" + $ref + "`")},
                {type:"mrkdwn", text:("*Triggered by:*\n" + $actor)},
                {type:"mrkdwn", text:"*Status:*\n❌ Scan failed"}
              ]},
              {type:"section", text:{type:"mrkdwn", text:"Gitleaks found something that looks like a secret. Open the run to see the file, line, and rule that matched. *Rotate first, clean up after.*"}},
              {type:"actions", elements:[{type:"button", text:{type:"plain_text", text:"Open run", emoji:true}, url:$url, style:"danger"}]},
              {type:"context", elements:[{type:"mrkdwn", text:"🔐 Automated alert from gitleaks standalone workflow (public repo)"}]}
            ]}')
          curl -sS --fail -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
